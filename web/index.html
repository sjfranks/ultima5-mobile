<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Ultima V</title>
    <!-- What a shared link shows: the description, and the box's painting with the title (docs/banner.png fitted to
         1200 by 630, its padding above: public/share.jpg). The page's address is GitHub Pages' (pages.yml). -->
    <meta
      name="description"
      content="Ultima V: Warriors of Destiny on a new engine, for the browser, the desktop, the Steam Deck and Android. Like OpenMW for Morrowind, it ships none of the 1988 game: it plays your own copy."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ultima V" />
    <meta property="og:title" content="Ultima V: Warriors of Destiny" />
    <meta
      property="og:description"
      content="The 1988 RPG on a new engine, for the browser, the desktop, the Steam Deck and Android: a modern look or the original, controller and touch, and your own copy of the game."
    />
    <meta property="og:url" content="https://synthwave-pixel.github.io/ultima5/" />
    <meta property="og:image" content="https://synthwave-pixel.github.io/ultima5/share.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Ultima V: Warriors of Destiny, 1988 to 2026 - the Avatar standing over his fallen friend, three Shadowlords looming over them, from the box's painting"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="icon" href="pwa-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      html,
      body {
        margin: 0;
        background: #000;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }
      canvas {
        /* The whole window: its own pixels are the display's (screen.ts sizes it to them), and where the game's
           320 by 200 screen goes in it is presentation.ts's - fitted whole, or in play on an upright phone the
           map low, the party or the log under it, then the touch bar. Square pixels, as the modern choice. Until the
           game first draws, what is on it (the loading notice) is fitted whole by object-fit. */
        position: fixed;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        width: 100dvw;
        height: 100dvh;
        object-fit: contain;
        image-rendering: auto;
        outline: none;
        display: block;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <canvas id="screen" width="320" height="200" tabindex="0"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
